services:

  # ── Base de Datos 1: índice de Dropbox (50 TB) ────────────────────────────
  db_dropbox:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: dropbox_index
    volumes:
      - ./db_dropbox_init:/docker-entrypoint-initdb.d/
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d dropbox_index"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s


  # ── Aplicación Python: pipeline de migración ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db_dropbox:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - /var/www/html/FILES/descarga_audios:/var/www/html/FILES/descarga_audios
      - /home/storage/FILES/descarga_audios:/home/storage/FILES/descarga_audios
      - ./output:/app/output               # CSVs de salida accesibles desde el host
