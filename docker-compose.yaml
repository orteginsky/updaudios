version: '3.8'

services:

  # ── Base de Datos 1: índice de Dropbox (50 TB) ────────────────────────────
  db_dropbox:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: dropbox_index
    volumes:
      - ./db_dropbox_init:/docker-entrypoint-initdb.d/
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d dropbox_index"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # ── Base de Datos 2: registros de audios/llamadas (IT) — MySQL 8.4 ─────────
  db_it:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: mendoza_box
    volumes:
      - ./db_it_init:/docker-entrypoint-initdb.d/
    ports:
      - "5434:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicación Python: pipeline de migración ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db_dropbox:
        condition: service_healthy
      db_it:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./audios_de_prueba:/audios         # Simulación del servidor de audios
      - ./output:/app/output               # CSVs de salida accesibles desde el host
